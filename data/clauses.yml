# Clause map for the handbook.
#
# One entry per ISO/IEC 17025:2017 clause at the level the handbook writes
# chapters for (one clause, one page). Titles are short labels in our own
# words, never the wording of the standard.
#
# Fields
#   number    clause number as a string
#   title     short label in our own words
#   part      handbook part (General, Structure, Resources, Process, Management system)
#   chapter   path of the chapter page, relative to docs/
#   templates list of template names (files arrive in version 0.4)
#   labqc     list of labqc links, or [] when no calculation is involved
#               ref: Python name, linked to the labqc API reference
#               app: page of the labqc web app (optional)
#               anchor: false to link the module page instead of the function
#   related   list of related clause numbers
#   status    planned | draft | reviewed
#
# If a new edition of the standard changes the numbering, change this file
# and the chapter paths; the badges, side panels and clause map follow.

edition: ISO/IEC 17025:2017

clauses:
